<h2>Confirm your Mintly account</h2>
<p>Enter this code on the confirmation page:</p>
<p style="font-size: 24px; font-weight: bold; letter-spacing: 4px">{{ .Token }}</p>
<p>Or <a href="{{ .ConfirmationURL }}">confirm your account</a> from this browser.</p>
<p>The code expires in one hour. If you didn't sign up for Mintly, you can ignore this email.</p>
<p>Need help? Email <a href="mailto:info@mintly.uk">info@mintly.uk</a>.</p>
