openapi: 3.0.3
info:
  title: Mintly Bank Account Checker API
  termsOfService: https://www.mintly.uk/terms
  contact:
    email: support@mintly.uk
  version: 1.2.1
  description: |
    The Mintly Bank Account Checker API connects your application to our
    comprehensive database of sort codes, bank contact and payment type details,
    and account number modulus algorithms. With a subscription you can check
    unlimited UK and Ireland sort codes and bank account numbers, plus unlimited
    IBAN and SWIFT/BIC lookups.

    The API is RESTful, using predictable, resource-oriented URLs with standard
    HTTP methods and status codes. All responses are JSON. Because it is
    OpenAPI 3.0 compliant, it integrates cleanly with any tooling that
    understands the OpenAPI standard.

    Questions? Email us at [support@mintly.uk](mailto:support@mintly.uk).

    ## Authentication

    Every request must carry an `X-API-KEY` header set to your organisation's
    unique key. Keep this secret — it identifies and bills your account. You can
    find your key in your [Mintly account](https://www.mintly.uk/dashboard).

    ```
    X-API-KEY: YOUR_API_KEY
    ```

    Call [`GET /identity`](#tag/Authentication-Check/operation/getIdentity) to confirm a key
    works before wiring up anything else.

    ## Security

    All Mintly APIs are served over HTTPS with TLS 1.2, so data is encrypted in
    transit. Never embed your API key in client-side code — proxy requests
    through your own backend instead.

    ## Environments

    | Environment | Base URL | Counts towards usage |
    |---|---|---|
    | Production | `https://api.mintly.uk/bankAccount/v1` | Yes |
    | Sandbox | `https://sandbox.mintly.uk/bankAccount/v1` | No |

    Develop against the **sandbox** first, so you can exercise every error path
    without consuming your allowance. The sandbox still requires your API key,
    but it returns a fixed set of responses and cannot perform real checks.

    Sandbox test values — every other input returns `404`:

    | Input | Value |
    |---|---|
    | Sort code | `424242` |
    | Account number | `42424242` |
    | SWIFT/BIC | `TEST4242XXX` |
    | IBAN | `GB42SAND424242 42424242` |

    Each request to production counts as one check against your monthly
    allowance. If your plan includes 10,000 checks, that is 10,000 requests.

    ## Status codes

    We use standard HTTP status codes, including but not limited to:

    | Status | Meaning |
    |---|---|
    | `200` OK | The request succeeded and produced a valid check. |
    | `400` Bad request | Something was wrong with the request. Check the error message in the response. |
    | `401` Unauthorised | Your credentials are invalid or have expired. |
    | `403` Forbidden | Authentication failed — the key has expired, or no key was provided. |
    | `404` Not found | The requested resource does not exist, so the result is invalid. |
    | `429` Too many requests | You have exceeded the rate limit. Wait, then retry with exponential backoff. |
    | `500` Server error | Something went wrong on our side — get in touch so we can look into it. |

    Errors return a `Status` of `Error` or `Invalid` alongside a human-readable
    `Message`.

    ## Backwards compatibility

    The API is designed to be backwards compatible: changes should not disrupt
    existing integrations. We may add new fields or response values, but we will
    not remove or rename existing fields, nor change their behaviour in a way
    that breaks current usage. We follow
    [semantic versioning](https://semver.org) for API releases.

    Build your integration to handle non-breaking changes gracefully, such as
    new fields or optional parameters. If a breaking change ever becomes
    necessary, we will give advance notice and a clear migration path, and keep
    the existing version available for a defined deprecation period.

    ## AI agent skill

    Install the Mintly Bank Account Checker agent skill for AI-assisted
    integration help inside your editor. Once installed, invoke `/mintly-api`
    to generate client code, handle errors, and test against the sandbox.

    **[Download the agent skill](https://www.mintly.uk/assets/mintly-api-skill.zip)**

    Built on the [Agent Skills open standard](https://agentskills.io/clients),
    it works with Claude Code, VS Code (GitHub Copilot), OpenAI Codex, Cursor,
    Gemini CLI, and many more.
externalDocs:
  description: Find out more about Mintly
  url: https://www.mintly.uk
servers:
  - url: https://api.mintly.uk/bankAccount/v1
    description: Production — every request counts towards your monthly allowance
  - url: https://sandbox.mintly.uk/bankAccount/v1
    description: Sandbox — fixed responses, not billed
tags:
  - name: Sort Code & Account Validation
    description: API endpoints to check sort codes and account numbers, to return branch information and accepted payment types
  - name: SWIFT / BIC Validation
    description: API endpoint to lookup SWIFT or BIC codes, to return branch information and accepted payment types
  - name: IBAN Validation
    description: API endpoint to validate IBANs and return branch information and accepted payment types
  - name: Authentication Check
    description: API endpoint for confirming API access
x-tagGroups:
  - name: Bank account validation
    tags:
      - Sort Code & Account Validation
      - SWIFT / BIC Validation
      - IBAN Validation
  - name: Account
    tags:
      - Authentication Check
paths:
  /sortcode/{sortCode}:
    get:
      tags:
        - Sort Code & Account Validation
      operationId: getSortCode
      summary: Check a sort code is valid
      x-codeSamples:
        - lang: cURL
          source: |
            curl 'https://api.mintly.uk/bankAccount/v1/sortcode/404784' \
              --header 'X-API-KEY: YOUR_API_KEY'
        - lang: JavaScript
          label: Node.js
          source: |
            const res = await fetch(
              `${BASE_URL}/sortcode/${encodeURIComponent(sortCode)}`,
              { headers: { 'x-api-key': process.env.MINTLY_API_KEY } }
            )
            const account = await res.json()
        - lang: Python
          source: |
            res = session.get(f"{BASE_URL}/sortcode/{sort_code}")
            res.raise_for_status()
            account = res.json()
        - lang: C#
          source: |
            var res = await _http.GetAsync($"/sortcode/{sortCode}");
            res.EnsureSuccessStatusCode();
            var account = await res.Content.ReadFromJsonAsync<Account>();
      description: >
        Takes a sort code string as input and returns 200 if the provided sort code exists. This endpoint also returns branch details for the associated bank branch using the Branch schema, as well as supported payment types.
        Supports all UK banks and finance institutions available in the Extended Industry Sort Code Directory (EISCD).
        

        ***Sandbox***: In the sandbox environment, the sort code `424242` will return valid, while all others will be invalid.
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/sortCodeParameter'
      responses:
        '200':
          description: Successful operation, the sort code is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SortCodeOnly'
              examples:
                sortCode:
                  $ref: '#/components/examples/SortCodeValidationExample'
        '400':
          description: No parameters provided, or invalid parameters provided. See the error message for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorised. The API key is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No API key provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Invalid sort code value. The sort code is not active or does not exist in our database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidSortCode:
                  summary: Invalid Sort Code
                  value:
                    Status: Invalid
                    Message: Invalid sort code
        '429':
          description: Too many requests sent by the client, exceeding the rate limit. Wait and try again.
        '500':
          description: Unexpected error.
  /swift/{bic}:
    get:
      tags:
        - SWIFT / BIC Validation
      operationId: getSwift
      summary: Check a SWIFT/BIC is valid
      x-codeSamples:
        - lang: cURL
          source: |
            curl 'https://api.mintly.uk/bankAccount/v1/swift/HLFXGB21XXX' \
              --header 'X-API-KEY: YOUR_API_KEY'
        - lang: JavaScript
          label: Node.js
          source: |
            const res = await fetch(
              `${BASE_URL}/swift/${encodeURIComponent(bic)}`,
              { headers: { 'x-api-key': process.env.MINTLY_API_KEY } }
            )
            const account = await res.json()
        - lang: Python
          source: |
            res = session.get(f"{BASE_URL}/swift/{bic}")
            res.raise_for_status()
            account = res.json()
        - lang: C#
          source: |
            var res = await _http.GetAsync($"/swift/{bic}");
            res.EnsureSuccessStatusCode();
            var account = await res.Content.ReadFromJsonAsync<Account>();
      description: >
        Takes a BIC string as input and returns 200 if the provided branch exists in our database. This endpoint also returns branch details for the associated bank branch using the Branch schema, as well as supported payment types.
        
        
        __The BIC provided must be 11 digits long. If you have an 8 digit BIC, you must add the suffix `XXX`.__
        
        
        If the BIC is not found in our database a 404 Not Found response is given; the BIC may still be valid but not exist in our database.
        Coverage of SWIFT/BIC is restricted to UK, Ireland and EEA SEPA member banks.


        ***Sandbox***: In the sandbox environment, the BIC `TEST4242XXX` will return valid, while all others will be invalid.
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/bicParameter'
      responses:
        '200':
          description: Successful operation, the BIC is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                swift:
                  $ref: '#/components/examples/SortCodeValidationExample'
        '400':
          description: No parameters provided, or invalid parameters provided. See the error message for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorised. The API key is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No API key provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: BIC not found. The BIC could still be valid, but does not exist in our database of UK, Ireland and EEA SEPA banks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bicNotSupported:
                  summary: BIC Not Supported
                  value:
                    Status: Error
                    Message: The SWIFT code requested is outside our coverage. Only UK and EEA banks supported.
                bicNotFound:
                  summary: BIC Not Found
                  value:
                    Status: Invalid
                    Message: SWIFT code not found
        '429':
          description: Too many requests sent by the client, exceeding the rate limit. Wait and try again.
        '500':
          description: Unexpected error. 
  /sortcode/{sortCode}/account/{accountNumber}:
    get:
      tags:
        - Sort Code & Account Validation
      operationId: getSortCodeAccount
      summary: Check a sort code and account number pair are valid
      x-codeSamples:
        - lang: cURL
          source: |
            curl 'https://api.mintly.uk/bankAccount/v1/sortcode/404784/account/70872490' \
              --header 'X-API-KEY: YOUR_API_KEY'
        - lang: JavaScript
          label: Node.js
          source: |
            const res = await fetch(
              `${BASE_URL}/sortcode/${encodeURIComponent(sortCode)}` +
                `/account/${encodeURIComponent(accountNumber)}`,
              { headers: { 'x-api-key': process.env.MINTLY_API_KEY } }
            )
            const account = await res.json()
        - lang: Python
          source: |
            res = session.get(f"{BASE_URL}/sortcode/{sort_code}/account/{account_number}")
            res.raise_for_status()
            account = res.json()
        - lang: C#
          source: |
            var res = await _http.GetAsync($"/sortcode/{sortCode}/account/{accountNumber}");
            res.EnsureSuccessStatusCode();
            var account = await res.Content.ReadFromJsonAsync<Account>();
      description: >
        Takes a sort code and account number strings as input and returns 200 if the provided sort code and account combination is valid. This endpoint also returns branch details for the associated bank branch using the Branch schema, as well as supported payment types.
        Supports all UK banks and finance institutions available in the Extended Industry Sort Code Directory (EISCD).


        Performs sort code lookup using the EISCD, and modulus checks (where available). A valid result does not guarantee that the account exists, only that it is a valid number for the sort code provided.


        ***Sandbox***: In the sandbox environment, sort code `424242` and account number `42424242` will return valid, while all others will be invalid.
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/sortCodeParameter'
        - $ref: '#/components/parameters/accountNumberParameter'
      responses:
        '200':
          description: Successful operation, the sort code and account number combination are valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                sortCodeAndAccount:
                  $ref: '#/components/examples/SortCodeAccountValidationExample'
        '400':
          description: No parameters provided, or invalid parameters provided. See the error message for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorised. The API key is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No API key provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Invalid sort code or account number. See the error message for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidSortCode:
                  summary: Invalid Sort Code
                  value:
                    Status: Invalid
                    Message: Invalid sort code
                invalidAccountNumber:
                  summary: Invalid Account Number
                  value:
                    Status: Invalid
                    Message: Invalid account number
        '429':
          description: Too many requests sent by the client, exceeding the rate limit. Wait and try again.
        '500':
          description: Unexpected error.
  /iban/{iban}:
    get:
      tags:
        - IBAN Validation
      operationId: getIban
      summary: Check an IBAN is valid
      x-codeSamples:
        - lang: cURL
          source: |
            curl 'https://api.mintly.uk/bankAccount/v1/iban/GB29NWBK40478470872490' \
              --header 'X-API-KEY: YOUR_API_KEY'
        - lang: JavaScript
          label: Node.js
          source: |
            const res = await fetch(
              `${BASE_URL}/iban/${encodeURIComponent(iban.replace(/\s/g, ''))}`,
              { headers: { 'x-api-key': process.env.MINTLY_API_KEY } }
            )
            const account = await res.json()
        - lang: Python
          source: |
            res = session.get(f"{BASE_URL}/iban/{iban.replace(' ', '')}")
            res.raise_for_status()
            account = res.json()
        - lang: C#
          source: |
            var res = await _http.GetAsync($"/iban/{iban.Replace(" ", "")}");
            res.EnsureSuccessStatusCode();
            var account = await res.Content.ReadFromJsonAsync<Account>();
      description: >
        Takes an IBAN string as input and returns 200 if the provided IBAN is valid. 
        

        __For UK, Republic of Ireland and Germany__: this endpoint also returns branch details (BranchData) for the associated bank branch using the Branch schema, as well as supported payment types.


        __For Rest of World__: IBAN lookup will only return Valid/Invalid status after performing checkdigit and national account validations.


        ***Sandbox***: In the sandbox environment, the IBAN `GB 42 SAND 424242 42424242` will be valid, while all others will be invalid.
        
      security:
        - api_key: []
      parameters:
        - $ref: '#/components/parameters/ibanParameter'
      responses:
        '200':
          description: Successful operation, the IBAN is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                ukIbanExample:
                  $ref: '#/components/examples/IbanValidationExample'
                rowIbanExample:
                  $ref: '#/components/examples/ROWIbanValidationExample'
        '400':
          description: No parameters provided, or invalid parameters provided. See the error message for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorised. The API key is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No API key provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: IBAN invalid, see the error message for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ibanInvalid:
                  summary: Invalid IBAN
                  value:
                    Status: Invalid
                    Message: Invalid IBAN
        '429':
          description: Too many requests sent by the client, exceeding the rate limit. Wait and try again.
        '500':
          description: Unexpected error.
  /identity:
    get:
      tags:
        - Authentication Check
      operationId: getIdentity
      summary: Check API authentication
      description: Used for testing API authentication.
      x-codeSamples:
        - lang: cURL
          source: |
            curl 'https://api.mintly.uk/bankAccount/v1/identity' \
              --header 'X-API-KEY: YOUR_API_KEY'
        - lang: JavaScript
          label: Node.js
          source: |
            const res = await fetch(`${BASE_URL}/identity`, {
              headers: { 'x-api-key': process.env.MINTLY_API_KEY },
            })
            const identity = await res.json()
        - lang: Python
          source: |
            res = session.get(f"{BASE_URL}/identity")
            res.raise_for_status()
            identity = res.json()
        - lang: C#
          source: |
            var res = await _http.GetAsync("/identity");
            res.EnsureSuccessStatusCode();
            var identity = await res.Content.ReadFromJsonAsync<Identity>();
      security:
        - api_key: []
      responses:
        '200':
          description: Identity is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          description: Identity is unauthorized. The API key is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No API key provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests sent by the client, exceeding the rate limit. Wait and try again.
        '500':
          description: Unexpected error.
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
  parameters:
    sortCodeParameter:
      name: sortCode
      in: path
      description: The sort code for the branch. Can optionally contain dashes or spaces.
      required: true
      explode: true
      example: 00-00-00
      schema:
        type: string
    bicParameter:
      name: bic
      in: path
      description: The SWIFT/BIC for the branch. Can optionally contain dashes or spaces.
      required: true
      explode: true
      example: HLFXGB21XXX
      schema:
        type: string
    accountNumberParameter:
      name: accountNumber
      in: path
      description: The account number to validate. Can optionally contain dashes or spaces.
      required: true
      explode: true
      example: '12345678'
      schema:
        type: string
    ibanParameter:
      name: iban
      in: path
      description: IBAN to validate. Can optionally contain dashes or spaces.
      required: true
      example: GB29 NWBK 404784 70872490
      schema:
        type: string
  schemas:
    SortCodeOnly:
      type: object
      properties:
        BranchData:
          $ref: '#/components/schemas/Branch'
        Status:
          type: string
          example: Valid
          description: The status of the check. Will be "Valid" for a successful check.
    Account:
      type: object
      properties:
        BranchData:
          $ref: '#/components/schemas/Branch'
        DerivedIban:
          type: string
          description: For accounts, the derived IBAN is provided. Is not provided for requests with sort code or BIC only.
          example:  GB 96 ABCD 010011 12345678
        ModulusCheckCompleted:
          type: boolean
          description: Whether the modulus check was performed. This is only provided for Sort Code & Account number requests and UK/ROI IBAN requests. Note that not all sort code ranges have modulus check algorithms defined; in these cases the result is Valid and ModulusCheckCompleted is false.
          example: true
        Status:
          type: string
          example: Valid
          description: The status of the check. Will be "Valid" for a successful check.
      required:
        - Status
    Branch:
      type: object
      description: Information about the bank branch.
      properties: 
        Info:
          $ref: '#/components/schemas/Info'
        Address:
          $ref: '#/components/schemas/Address'
        PaymentTypes:
          $ref: '#/components/schemas/PaymentTypes'
        PaymentSchemeClosedDates:
          $ref: '#/components/schemas/PaymentSchemeClosedDates'
        Redirection:
          $ref: '#/components/schemas/Redirection'
      required:
        - Info
        - Address
        - PaymentTypes
        - PaymentSchemeClosedDates
        - Redirection
    Info:
      type: object
      description: Basic branch information, including branch name and owning bank.
      properties:
        SortCode:
          type: string
          description: The six digit sort code for the branch
          example: '100144'
        ShortOwningBank:
          type: string
          description: The name of the bank. Maximum 20 characters.
          example: NAT WEST  
        BranchName:
          type: string
          description: The name of the branch. It defines the actual location of the bank office. Maximum 30 characters.
          example: "BRANCH NAME"
        BicField1: 
          type: string
          description: The first part of the Bank Identification Code (BIC). Maximum 8 characters. Some branches do not have BIC.
          example: AB12ABC
        BicField2: 
          type: string
          description: The second part of the Bank Identification Code (BIC). Maximum 3 characters. Some branches do not have BIC.
          example: XXX
        ShortBranchTitle: 
          type: string
          description: The short branch title. Maximum 30 characters.
          example: Bank Branch Title
        SupervisoryBody: 
          type: string
          description: The supervisory body (A for PRA/FCA, B for other financial authorities, C for Jersey, Guernsey or Isle of Man, D for Other)
          example: A
        BranchMinorLocation:
          type: string
          description: Optional field; indicates the actual branch minor location. Maximum 30 characters.
          example: Branch Location
        BranchMajorLocation:
          type: string
          description: Optional field; indicates the actual branch major location, usually nearest postal office district. Maximum 30 characters.
          example: BATH
      required:
        - ShortOwningBank
    Address:
      type: object
      description: The postal address provided by the bank. Note that this may not be the postal address of the branch, and could be a central customer service address for some banks.
      properties:
        BranchAddressPart1:
          type: string
          description: The first line of the address. Maximum 40 characters.
          example: 123 Main Street
        BranchAddressPart2:
          type: string
          description: The second line of the address. Maximum 40 characters.
        BranchAddressPart3:
          type: string
          description: The third line of the address. Maximum 40 characters.
        BranchAddressPart4:
          type: string
          description: The fourth line of the address. Maximum 40 characters.
        BranchTown:
          type: string
          description: The postal town of the address. Maximum 30 characters.
          example: Hobbiton
        BranchCounty:
          type: string
          description: The postal county of the address. Maximum 30 characters.
          example: The Shire
        BranchPostCode1:
          type: string
          description: The first part of the postcode. Maximum 4 characters.
          example: B1
        BranchPostCode2:
          type: string
          description: The second part of the postcode. Maximum 4 characters.
          example: LB0
        BranchCountry:
          type: string
          description: The ISO Alpha-2 country code. Maximum 2 characters.
          example: GB
        BranchTelephoneArea:
          type: string
          description: The area code of the branch telephone number
          example: '0800'
        BranchTelephone:
          type: string
          description: The branch telephone number
          example: '1234567'
        BranchTelephone2Area:
          type: string
          description: The area code of the branch secondary telephone number
        BranchTelephone2:
          type: string
          description: The branch secondary telephone number
    PaymentTypes:
      type: object
      description: Gives information on the types of payment schemes that the bank branch supports.
      properties:
        DirectDebitAccepted: 
          type: boolean
          description: Whether the bank accepts Direct Debit payments
        DirectCreditAccepted: 
          type: boolean
          description: Whether the bank accepts Direct Credit payments
        DirectDebitInstructionsAccepted: 
          type: boolean
          description: Whether the bank accepts Direct Debit Instructions
        AuddisAccepted:
          type: boolean
          description: Whether the bank accepts Automated Direct Debit Instructions (AUDDIS)
        DividendInterestAccepted: 
          type: boolean
          description: Whether the bank accepts Dividend Interest payments
        BacsAccepted:
          type: boolean
          description: Whether the bank accepts BACS payments
        ChapsAccepted:
          type: boolean
          description: Whether the bank accepts Chaps Sterling payments
        IcsAccepted:
          type: boolean
          description: Whether the bank accepts ICS payments
        FasterPaymentAccepted:
          type: boolean
          description: Whether the bank accepts Faster Payments
        SepaMember: 
          type: boolean
          description: Whether the bank is a member of SEPA (Single European Payments Area)
        SepaDirectDebit:
          type: boolean
          description: Whether the bank supports SEPA Direct Debit
      required:
        - DirectDebitAccepted
        - DirectCreditAccepted
        - DirectDebitInstructionsAccepted
        - AuddisAccepted
        - DividendInterestAccepted
        - BacsAccepted
        - ChapsAccepted
        - IcsAccepted
        - FasterPaymentAccepted
        - SepaMember
        - SepaDirectDebit
    
    
    PaymentSchemeClosedDates:
      type: object
      description: Where a bank branch has left a payment scheme, this object provides the dates that the scheme support ended.
      properties:
        BacsClosedDate:
          type: string
          format: date-time
          description: The date on which the branch stopped accepting BACS payments
          example: 2018-03-20T09:12:28Z
        ChapsClosedDate:
          type: string
          format: date-time
          description: The date on which the branch stopped accepting CHAPS payments
          example: 2018-03-20T09:12:28Z
        IcsClosedDate:
          type: string
          format: date-time
          description: The date on which the branch stopped accepting ICS
          example: 2018-03-20T09:12:28Z
        FasterPaymentsClosedDate:
          type: string
          format: date-time
          description: The date on which the branch stopped accepting Faster Payments
          example: 2018-03-20T09:12:28Z
        SepaClosedDate:
          type: string
          format: date-time
          description: The date on which the branch stopped accepting SEPA payments
          example: 2018-03-20T09:12:28Z
    Redirection:
      type: object
      description: Information on whether the branch supports redirected payments.
      properties:
        BacsRedirectionToSortCode:
          type: string
          description: The sort code that BACS payments to this branch will be redirected to
          example: '123456'
        BacsHasTransferableAccountNumbers:
          type: boolean
          description: Whether the branch has numbered accounts that can be transferred. On redirection (if true) the account number is not set to zero.
          example: true
        FasterPaymentsRedirectToSortCode:
          type: string
          description: The sort code that Faster Payments to this branch will be redirected to
          example: '123456'
        FasterPaymentsHasTransferableAccountNumbers:
          type: boolean
          description: Whether the branch has numbered accounts that can be transferred. On redirection (if true) the account number is not set to zero.
          example: false
    
    Identity:
      type: object
      properties:
        AuthId:
          type: string
          description: An authentication ID that is unique to your customer account. Will never change.
          example: ABC1
        Status:
          type: string
          description: The status of the check. "Valid" for successful identity check.
          example: Valid
      required:
        - Status
        - AuthId
    Error:
      type: object
      description: Provides additional context for API errors, along with the HTTP Status.
      properties:
        Status:
          type: string
          description: The status. For an error, will be "Error" or "Invalid"
          example: Error
        Message:
          type: string
          description: A description of the error/problem that occurred, or reason for invalid result.
      required:
        - Status
        - Message

